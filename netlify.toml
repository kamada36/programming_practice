# Netlify（Free Plan）デプロイ設定
# Next.js を静的HTML出力（output: 'export'）でビルドし、out/ を配信する。

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  # Netlify の Next.js ランタイム（サーバーレス関数）を使わず、純粋な静的配信にする
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# 静的エクスポートの 404 ページ
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
